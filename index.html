<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Recall</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  display: flex;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  background: #0f1117;
  color: #c9d1d9;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ─────────────────────────────────── */
#sidebar {
  width: 220px;
  min-width: 220px;
  background: #161b22;
  border-right: 1px solid #30363d;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  height: 100vh;
}

.lang-tabs {
  display: flex;
  border-bottom: 1px solid #30363d;
  flex-shrink: 0;
}

.lang-tab {
  flex: 1;
  padding: 10px 6px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  color: #8b949e;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}

.lang-tab.active {
  color: #58a6ff;
  border-bottom-color: #58a6ff;
}

.lang-tab:hover:not(.active) { color: #c9d1d9; }

.cat-list {
  padding: 8px 0;
  flex: 1;
}

.cat-group {
  padding: 6px 12px 2px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #484f58;
}

.cat-link {
  display: block;
  padding: 5px 12px 5px 16px;
  font-size: 12px;
  color: #8b949e;
  text-decoration: none;
  border-left: 2px solid transparent;
  transition: color 0.1s, border-color 0.1s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cat-link:hover { color: #c9d1d9; }
.cat-link.active { color: #58a6ff; border-left-color: #58a6ff; background: #1c2128; }

/* ── Main content ────────────────────────────── */
#main {
  flex: 1;
  overflow-y: auto;
  padding: 0 32px 64px;
  height: 100vh;
  scroll-behavior: smooth;
}

.lang-section { display: none; }
.lang-section.visible { display: block; }

.section-heading {
  font-size: 22px;
  font-weight: 700;
  color: #e6edf3;
  margin: 40px 0 4px;
  padding-top: 16px;
  border-bottom: 1px solid #21262d;
  padding-bottom: 8px;
}

.sub-heading {
  font-size: 13px;
  font-weight: 600;
  color: #58a6ff;
  margin: 20px 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ── Entry ───────────────────────────────────── */
.entry {
  margin-bottom: 12px;
  padding: 8px 10px;
  background: #161b22;
  border-radius: 6px;
  border-left: 3px solid #21262d;
}

.entry:hover { border-left-color: #388bfd; }

.sig {
  display: block;
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 12px;
  color: #8b949e;
  margin-bottom: 4px;
}

.snippet {
  display: block;
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 12px;
  color: #e6edf3;
  background: #0d1117;
  padding: 4px 8px;
  border-radius: 4px;
  margin-bottom: 5px;
  white-space: pre;
  overflow-x: auto;
}

/* Syntax colouring (hand-coded) */
.kw  { color: #ff7b72; }  /* keywords: val, fun, it, etc. */
.fn  { color: #d2a8ff; }  /* function calls */
.str { color: #a5d6ff; }  /* string literals */
.num { color: #79c0ff; }  /* numbers */
.cm  { color: #484f58; }  /* comments */
.ty  { color: #ffa657; }  /* types */

.desc {
  font-size: 12px;
  color: #8b949e;
  line-height: 1.5;
}

/* ── Collapsible Advanced ────────────────────── */
details { margin-top: 24px; }

details > summary {
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: #8b949e;
  padding: 8px 10px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 6px;
  list-style: none;
  user-select: none;
}

details > summary::before { content: '▶  '; font-size: 10px; }
details[open] > summary::before { content: '▼  '; }
details > summary:hover { color: #c9d1d9; }
details[open] > summary { border-radius: 6px 6px 0 0; border-bottom-color: #21262d; }
details .adv-content { padding: 4px 0; border: 1px solid #30363d; border-top: none; border-radius: 0 0 6px 6px; padding: 8px; }

/* ── Scrollbar ───────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
</style>
</head>
<body>

<nav id="sidebar">
  <div class="lang-tabs">
    <button class="lang-tab active" data-lang="kotlin">Kotlin</button>
    <!-- Add future language tabs here -->
  </div>
  <div class="cat-list" id="kotlin-nav">
    <div class="cat-group">Stdlib — Core</div>
    <a class="cat-link" href="#kt-collections">Collections</a>
    <a class="cat-link" href="#kt-strings">Strings</a>
    <a class="cat-link" href="#kt-sequences">Sequences</a>
    <a class="cat-link" href="#kt-scope">Scope Functions</a>
    <a class="cat-link" href="#kt-io">I/O</a>
    <div class="cat-group">Stdlib — Advanced</div>
    <a class="cat-link" href="#kt-stdlib-adv">Regex · Ranges · Delegates · Math · Result…</a>
    <div class="cat-group">Coroutines — Core</div>
    <a class="cat-link" href="#kt-coro-builders">Builders</a>
    <a class="cat-link" href="#kt-coro-context">Context &amp; Dispatchers</a>
    <a class="cat-link" href="#kt-coro-timing">Timing</a>
    <a class="cat-link" href="#kt-coro-flow">Flow</a>
    <a class="cat-link" href="#kt-coro-channels">Channels</a>
    <a class="cat-link" href="#kt-coro-errors">Exception Handling</a>
    <div class="cat-group">Coroutines — Advanced</div>
    <a class="cat-link" href="#kt-coro-adv">Hot Flows · Select · Mutex · Testing…</a>
  </div>
</nav>

<main id="main">
  <section id="kotlin" class="lang-section visible">

    <!-- Collections content goes here (Task 3) -->
    <!-- Strings, Sequences, Scope, I/O content goes here (Task 4) -->
    <!-- Stdlib Advanced details element goes here (Task 5) -->
    <!-- Coroutines Core sections go here (Task 6) -->
    <!-- Coroutines Advanced details element goes here (Task 7) -->

  </section>
  <!-- Future language sections: <section id="python" class="lang-section"> ... </section> -->
</main>

<script>
// ── Tab switching ──────────────────────────────
document.querySelectorAll('.lang-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.lang-section').forEach(s => s.classList.remove('visible'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.lang).classList.add('visible');
  });
});

// ── Sidebar active link on scroll ─────────────
const headings = document.querySelectorAll('.section-heading[id]');
const links = document.querySelectorAll('.cat-link');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      links.forEach(l => l.classList.remove('active'));
      const active = document.querySelector(`.cat-link[href="#${entry.target.id}"]`);
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-10% 0px -80% 0px' });

headings.forEach(h => observer.observe(h));
</script>

</body>
</html>
